<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Road Trip Games</title>
<meta name="theme-color" content="#0e7c86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Road Trip">
<style>
:root{--sea:#0e7c86;--sea2:#17a9a6;--sand:#f7eedc;--sun:#ff8a3d;--ink:#1d2b36;--card:#fff;--muted:#6b7a86;--line:#e6ebee;--bad:#d64545;--soft:#e7eff1}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--sand);color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,var(--sea),var(--sea2));color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header a,header button{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:15px;text-decoration:none;font-weight:600}
main{padding:12px 14px 80px;max-width:720px;margin:0 auto}
.hero{background:linear-gradient(160deg,#fff7ea,#ffe2c7);border-radius:16px;padding:16px;margin:4px 0 6px}
.hero b{font-size:20px;display:block;margin-bottom:4px}
.group h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 4px 6px}
.tile{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:13px 14px;margin:8px 0;box-shadow:0 1px 3px rgba(0,0,0,.07);text-decoration:none;color:inherit}
.tile .ico{font-size:28px;width:38px;text-align:center;flex:none}
.tile b{display:block;font-size:17px}
.tile span{color:var(--muted);font-size:14px;line-height:1.3}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.card h3{margin:0 0 8px;font-size:16px}
.card.phones{background:#fff4e6;box-shadow:inset 0 0 0 2px #ffcf9e}
.card.phones div{line-height:1.45}
details.rules summary{font-weight:700;font-size:16px;cursor:pointer;list-style:none}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary:after{content:" (tap to hide)";color:var(--muted);font-weight:400;font-size:13px}
details.rules:not([open]) summary:after{content:" (tap to show)"}
.rules ul{margin:8px 0 0;padding-left:20px}
.rules li{margin:6px 0;line-height:1.4}
.title{font-size:26px;font-weight:800;margin:8px 0 2px}
.blurb{color:var(--muted);margin:0 0 4px}
.btn{appearance:none;border:0;border-radius:12px;padding:11px 16px;font-size:16px;font-weight:700;background:var(--sea);color:#fff;min-height:46px;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.warn{background:var(--bad)}
.btn.sun{background:var(--sun)}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.row > .grow{flex:1}
.big{font-size:60px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0}
.prompt{font-size:22px;font-weight:700;text-align:center;line-height:1.3;padding:16px 6px;min-height:96px;display:flex;align-items:center;justify-content:center}
.prompt.dim{color:var(--muted);font-weight:500;font-size:18px}
.sub{font-size:13px;color:var(--muted);text-align:center}
.score{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}
.score:last-child{border-bottom:0}
.score .name{flex:1;font-size:17px;font-weight:600}
.score .n{min-width:46px;text-align:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.score button{min-width:44px;height:44px;border-radius:22px;border:0;font-size:17px;font-weight:700;background:var(--soft);color:var(--ink);padding:0 10px;cursor:pointer}
.score button.plus{background:var(--sea);color:#fff}
.score.lead .name:after{content:" \1F451"}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--sea);background:#fff;color:var(--sea);border-radius:999px;padding:8px 14px;font-size:16px;font-weight:700;cursor:pointer}
.chip.on{background:var(--sea);color:#fff}
.chip.out{border-color:#ccc;color:#aaa;text-decoration:line-through;background:#f3f3f3}
.chip small{font-weight:800;margin-left:6px}
.bingo{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.bingo button{aspect-ratio:1;border:0;border-radius:8px;background:#fff;font-size:10.5px;overflow-wrap:anywhere;hyphens:auto;line-height:1.15;padding:3px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 1px #d8e0e4;cursor:pointer;overflow:hidden}
.bingo button.on{background:var(--sun);color:#fff;box-shadow:none}
.bingo button.free{background:var(--sea);color:#fff;box-shadow:none}
.bingo button.win{outline:3px solid #ffd23f;outline-offset:-3px}
.letters{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.letters div{text-align:center;padding:8px 0;border-radius:8px;background:var(--soft);font-weight:800;color:#9aa7b0}
.letters div.done{background:var(--sea);color:#fff}
.letters div.now{background:var(--sun);color:#fff}
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.plates button{border:0;border-radius:9px;padding:9px 4px;font-size:13px;font-weight:700;background:#fff;box-shadow:inset 0 0 0 1px #d8e0e4;color:var(--ink);cursor:pointer}
.plates button.on{background:var(--sea);color:#fff;box-shadow:none}
.banner{background:var(--sun);color:#fff;text-align:center;font-size:26px;font-weight:800;border-radius:14px;padding:12px;margin:10px 0;animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.85)}70%{transform:scale(1.05)}100%{transform:scale(1)}}
.herd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.herd .card{margin:0;text-align:center}
.herd input{text-align:center;font-weight:700}
.ghost{font-size:22px;font-weight:800;letter-spacing:.15em;color:var(--bad);min-width:96px;text-align:center}
.strikes{font-size:44px;font-weight:900;color:var(--bad);text-align:center;letter-spacing:.2em;min-height:56px}
input,select,textarea{font-size:16px;padding:10px;border-radius:10px;border:1px solid #cdd6db;width:100%;font-family:inherit;background:#fff}
label{font-size:14px;color:var(--muted);display:block;margin:8px 0 4px}
.muted{color:var(--muted);font-size:14px}
.chain{margin:8px 0 0;padding:0;list-style:none}
.chain li{padding:6px 0;border-bottom:1px dashed var(--line)}
.secret{font-size:30px;font-weight:800;letter-spacing:.12em;text-align:center;margin:8px 0}
.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.result{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.result:first-child{font-weight:800}
.spacer{height:8px}
.toggle{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.toggle button{flex:1;border:0;border-radius:9px;padding:10px;font-size:15px;font-weight:700;background:transparent;color:var(--muted);cursor:pointer}
.toggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<script>
(function(){
'use strict';

/* ---------- state ---------- */
var KEY='rtg-v1';
var S;
try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
S.games=S.games||{};
var DEFAULT_PLAYERS=[['Dad','parents'],['Mom','parents'],['Pearce','kids'],['Danielle','kids'],['Kaitlan','kids'],['Aria','kids']];
if(!S.players)S.players=DEFAULT_PLAYERS.map(function(p){return{name:p[0],team:p[1]}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function G(id){return S.games[id]||(S.games[id]={})}
function players(){return S.players.map(function(p,i){return{id:'p'+i,label:p.name,team:p.team}})}
function kids(){return players().filter(function(p){return p.team==='kids'})}
function nameOf(id){var p=players().filter(function(p){return p.id===id})[0];return p?p.label:id}
function teams(){return [{id:'parents',label:'Parents'},{id:'kids',label:'Kids'}]}

/* ---------- helpers ---------- */
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else if(k==='class')el.className=v;
    else if(k==='value')el.value=v;
    else el.setAttribute(k,v===true?'':v)}
  var kidsArr=[].slice.call(arguments,2);
  (function add(list){list.forEach(function(c){if(c==null||c===false)return;if(Array.isArray(c))return add(c);el.appendChild(c.nodeType?c:document.createTextNode(String(c)))})})(kidsArr);
  return el}
function act(fn){return function(e){fn(e);save();refresh()}}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a,r){r=r||Math.random;a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function seeded(str){var x=1779033703^str.length;for(var i=0;i<str.length;i++){x=Math.imul(x^str.charCodeAt(i),3432918353);x=x<<13|x>>>19}
  return function(){x=Math.imul(x^x>>>16,2246822507);x=Math.imul(x^x>>>13,3266489909);x^=x>>>16;return(x>>>0)/4294967296}}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
var AC=null;
function beep(f,d){f=f||880;d=d||.15;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.3,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d)}catch(e){}
  if(navigator.vibrate)try{navigator.vibrate(d>.3?300:60)}catch(e){}}

/* ---------- reusable pieces ---------- */
function rulesCard(rules){
  return h('details',{class:'card rules',open:true},h('summary',null,'How to play'),h('ul',null,rules.map(function(r){return h('li',null,r)})))}

function scoreboard(st,key,entities,steps){
  steps=steps||[1];st[key]=st[key]||{};var sc=st[key];
  var max=-Infinity;entities.forEach(function(e){max=Math.max(max,sc[e.id]||0)});
  return h('div',{class:'card'},h('h3',null,'Score'),
    entities.map(function(e){var n=sc[e.id]||0;
      return h('div',{class:'score'+(n>0&&n===max?' lead':'')},
        h('div',{class:'name'},e.label),
        h('button',{onclick:act(function(){sc[e.id]=(sc[e.id]||0)-1})},'-1'),
        h('div',{class:'n'},n),
        steps.map(function(s){return h('button',{class:'plus',onclick:act(function(){sc[e.id]=(sc[e.id]||0)+s})},'+'+s)}))}),
    h('div',{class:'spacer'}),
    h('button',{class:'btn alt',onclick:act(function(){if(confirm('Reset the scores?'))st[key]={}})},'Reset scores'))}

function deck(st,key,items,opts){
  opts=opts||{};st[key]=st[key]||{cur:-1,seen:[]};var d=st[key];
  if(d.cur>=items.length)d.cur=-1;
  var text=d.cur<0?(opts.empty||'Tap Draw for a card'):items[d.cur];
  return h('div',{class:'card'},
    opts.title?h('h3',null,opts.title):null,
    h('div',{class:'prompt'+(d.cur<0?' dim':'')},text),
    h('div',{class:'row center'},
      h('button',{class:'btn',onclick:act(function(){
        var pool=[];for(var i=0;i<items.length;i++)if(d.seen.indexOf(i)<0)pool.push(i);
        if(!pool.length){d.seen=[];for(i=0;i<items.length;i++)if(i!==d.cur)pool.push(i)}
        d.cur=pool[rnd(pool.length)];d.seen.push(d.cur)})},d.cur<0?'Draw':(opts.next||'Next')),
      opts.extra||null),
    h('div',{class:'sub'},d.seen.length+' of '+items.length+' used'))}

var T={};
function timer(key,secs,o){
  o=o||{};var t=T[key];
  if(!t||t.secs!==secs)t=T[key]={secs:secs,left:secs,el:0,run:false,iv:0,last:0};
  function show(){var d=document.getElementById('tm-'+key);if(d)d.textContent=o.up?fmt(t.el):fmt(t.left);
    var b=document.getElementById('tb-'+key);if(b)b.textContent=t.run?'Pause':((o.up?t.el>0:t.left>0&&t.left<t.secs)?'Resume':'Start')}
  function tick(){var now=Date.now(),dt=(now-t.last)/1000;t.last=now;
    if(o.up){t.el+=dt}else{var prev=t.left;t.left=Math.max(0,t.left-dt);
      if(o.beepAt&&t.left>0&&Math.ceil(t.left)<Math.ceil(prev)&&Math.ceil(t.left)<=o.beepAt)beep(660,.08);
      if(t.left<=0){stop();beep(440,.7);if(o.onEnd)o.onEnd()}}
    show()}
  function start(){if(t.run)return;if(!o.up&&t.left<=0)t.left=t.secs;t.run=true;t.last=Date.now();t.iv=setInterval(tick,100);show()}
  function stop(){t.run=false;clearInterval(t.iv);show()}
  function reset(){stop();t.left=t.secs;t.el=0;show()}
  t.start=start;t.stop=stop;t.reset=reset;
  setTimeout(show,0);
  return h('div',null,
    h('div',{class:'big',id:'tm-'+key},o.up?fmt(t.el):fmt(t.left)),
    o.hideButtons?null:h('div',{class:'row center'},
      h('button',{class:'btn',id:'tb-'+key,onclick:function(){t.run?stop():start()}},'Start'),
      h('button',{class:'btn alt',onclick:reset},'Reset')))}

function turnPicker(st,key,label){
  var ps=players();st[key]=st[key]||0;var i=st[key]%ps.length;
  return h('div',{class:'card'},
    h('div',{class:'sub'},label||'Up now'),
    h('div',{class:'prompt',style:'min-height:0;padding:6px'},ps[i].label),
    h('div',{class:'row center'},
      h('button',{class:'btn alt',onclick:act(function(){st[key]=(st[key]+ps.length-1)%ps.length})},'Back'),
      h('button',{class:'btn',onclick:act(function(){st[key]=(st[key]+1)%ps.length})},'Next person')))}

function outTracker(st,key,title){
  st[key]=st[key]||{};var out=st[key];var ps=players();
  var alive=ps.filter(function(p){return!out[p.id]});
  return h('div',{class:'card'},
    h('h3',null,title||'Tap a name when they are out'),
    alive.length===1?h('div',{class:'banner'},alive[0].label+' wins!'):null,
    h('div',{class:'chips'},ps.map(function(p){return h('button',{class:'chip'+(out[p.id]?' out':''),onclick:act(function(){out[p.id]=!out[p.id]})},p.label)})),
    h('div',{class:'spacer'}),
    h('button',{class:'btn alt',onclick:act(function(){st[key]={}})},'New round'))}

function levelPicker(st,note){st.level=st.level||3;
  return h('div',{class:'card'},h('h3',null,'Level'),
    h('div',{class:'chips'},[1,2,3,4,5].map(function(n){return h('button',{class:'chip'+(st.level===n?' on':''),onclick:act(function(){st.level=n})},'Level '+n)})),
    note?h('div',{class:'sub',style:'margin-top:6px'},note(st.level)):null)}
function chipPick(options,cur,onpick){
  return h('div',{class:'chips'},options.map(function(o){return h('button',{class:'chip'+(o===cur?' on':''),onclick:act(function(){onpick(o)})},o)}))}

function twentyQ(st,cats){
  st.n=st.n||0;st.yes=st.yes||0;st.no=st.no||0;
  var done=st.n>=20;
  return [
    cats?deck(st,'cat',cats,{title:'Pick a category (optional)',empty:'Tap Draw for a category'}):null,
    h('div',{class:'card'},
      h('div',{class:'sub'},'Questions asked'),
      h('div',{class:'big'},st.n+' / 20'),
      st.got?h('div',{class:'banner'},'Got it in '+st.got+'!'):done?h('div',{class:'banner'},'Out of questions. The thinker wins!'):null,
      h('div',{class:'row center'},
        h('button',{class:'btn',disabled:done||st.got?true:null,onclick:act(function(){st.n++;st.yes++})},'Yes'),
        h('button',{class:'btn',disabled:done||st.got?true:null,onclick:act(function(){st.n++;st.no++})},'No'),
        h('button',{class:'btn alt',disabled:done||st.got?true:null,onclick:act(function(){st.n++})},'Sort of')),
      h('div',{class:'sub'},st.yes+' yes, '+st.no+' no'),
      h('div',{class:'spacer'}),
      h('div',{class:'row center'},
        h('button',{class:'btn sun',onclick:act(function(){st.got=st.n||1})},'Guessed it!'),
        h('button',{class:'btn alt',onclick:act(function(){st.n=0;st.yes=0;st.no=0;st.got=0})},'New round')))]}

function secretBox(st,key,placeholder){
  st[key]=st[key]||{text:'',show:false};var s=st[key];
  return h('div',null,
    s.show?h('div',{class:'secret'},s.text||'(nothing written)'):
      h('input',{type:'password',placeholder:placeholder||'Type it secretly',value:s.text,autocomplete:'off',oninput:function(e){s.text=e.target.value;save()}}),
    h('div',{class:'spacer'}),
    h('button',{class:'btn '+(s.show?'alt':'sun'),onclick:act(function(){s.show=!s.show})},s.show?'Hide':'Reveal'))}

/* ---------- content ---------- */
var BINGO=['Wind turbine','Oil pumpjack',"Buc-ee's billboard",'Whataburger','Longhorn','Hawk on a fence post','Round hay bale','Texas flag on a house','Boat being towed','Out-of-state plate','Dairy Queen','Water tower with a town name','Horse','Goat','Deer','Cemetery','Tractor','Dog in a truck bed','Motorcycle','RV or camper','Train','Bridge over a river',"Don't Mess with Texas sign",'Rest area sign','75 mph speed limit','Police car','Fireworks stand','Lawyer billboard','Feed store','Cattle trailer','Old windmill','Oil storage tanks','Church steeple','Sonic','Produce stand','Donkey','Birds on a power line','Hay trailer','Kayak or surfboard on a car','Historical marker'];
var STATES=['Alabama','Alaska','Arizona','Arkansas','California','Colorado','Connecticut','Delaware','Florida','Georgia','Hawaii','Idaho','Illinois','Indiana','Iowa','Kansas','Kentucky','Louisiana','Maine','Maryland','Massachusetts','Michigan','Minnesota','Mississippi','Missouri','Montana','Nebraska','Nevada','New Hampshire','New Jersey','New Mexico','New York','North Carolina','North Dakota','Ohio','Oklahoma','Oregon','Pennsylvania','Rhode Island','South Carolina','South Dakota','Tennessee','Texas','Utah','Vermont','Virginia','Washington','West Virginia','Wisconsin','Wyoming'];
var BONUS_PLATES=['Washington DC','Mexico','Canada','Military / Gov'];
var HOTSEAT=['What is the best day you can remember?','If you could live anywhere in the world, where?','Who is your favorite teacher ever, and why?','What is the most embarrassing thing that happened to you this year?','You have $1,000 and must spend it today. What do you buy?','What is one thing you would change about family road trips?','Which person in this car are you most like?','What is your dream job right now?','What song are you secretly embarrassed to love?','What is the worst food you have ever eaten?','If you could swap lives with anyone in this car for a day, who?','What is the most-used app on your phone?','What is something you are proud of that nobody noticed?','What is your hidden talent?','What was the best part of this weekend?','If you had a theme song, what would it be?','What is the last thing that made you laugh really hard?','What is something you want to learn this year?','Who is the funniest person in this car?','What scares you the most?','What does your perfect Saturday look like?','If you could be famous for one thing, what would it be?','What is one rule at our house you would change?','Where do you think you will be in 10 years?','What is the best gift you ever got?','What is your most unpopular opinion?','If you could have any superpower, which one and why?','What is a habit you wish you could break?'];
var WYR=['Be a dolphin or a pelican?','Swim with a jellyfish or a crab in your swimsuit?','Live on the beach or in the mountains?','Have sand in your shoes forever or sunscreen in your eyes once a day?','Only eat Whataburger or only eat Chick-fil-A for a year?','Surf a giant wave or ride the biggest roller coaster?','Find a treasure chest or a message in a bottle?','Never go in the ocean again or never go in a pool again?','Have a pet seagull or a pet sea turtle?','Be able to breathe underwater or fly?','Always be 10 minutes late or always 30 minutes early?','Have no phone for a month or no dessert for a year?','Be the funniest person in the room or the smartest?','Live without music or without movies?','Have a personal chef or a personal driver?','Know the future or change the past?','Be famous on TikTok or famous in history books?','Give up pizza or give up tacos?','Explore space or the deep ocean?','Be stuck in traffic for 3 hours or ride in silence for 1 hour?','Have a giant water slide at home or a movie theater?','Be a kid forever or a grown-up right now?','Talk to animals or speak every language?','Never be cold again or never be hot again?','Eat a sand sandwich or drink a cup of salt water?','Have a beach house or a cabin in the woods?','Meet a mermaid or meet a pirate?','Win the lottery or have the perfect job?'];
var FORTUNE=['Fortunately, we found a treasure chest buried on the beach...','Fortunately, a dolphin swam right up to our boat...','Fortunately, Buc-ee\'s gave us free brisket for life...','Fortunately, the car started flying...','Fortunately, we found a secret island no one had ever seen...','Fortunately, a seagull dropped a golden ticket in our lap...','Fortunately, we won a contest to meet our favorite singer...','Fortunately, the dog learned how to talk...'];

{id:'cows',group:'spot',ico:'🐄',title:'My Cows',blurb:'1 point for every cow pasture on your side. Cemeteries cost you a quarter.',
 phones:"One phone keeps score: Natalie's. Everyone else just shouts out cow pastures on their side.",
 rules:['Each side of the car scores on their side of the road.','1 point for every pasture or ranch with cows in it. 2 cows or 200 cows, it is still 1 point.','Pass a cemetery on your side and you lose a quarter of your points (rounded up, so a cemetery always costs at least 1).','Most points when you pull into the driveway wins.','Arguments about whether it was a cow or a horse are settled by the driver.'],
 body:function(st){st.left=st.left||0;st.right=st.right||0;st.lname=st.lname||'Left side';st.rname=st.rname||'Right side';st.hist=st.hist||{left:[],right:[]};st.log=st.log||[];
  function side(k,nk){var hist=st.hist[k];var last=hist[hist.length-1];return h('div',{class:'card'},
    h('input',{value:st[nk],onchange:function(e){st[nk]=e.target.value;save()}}),
    h('div',{class:'big'},st[k]),
    h('div',{class:'row center'},h('button',{class:'btn',style:'min-width:150px;font-size:20px',onclick:act(function(){st[k]+=1;hist.push({t:'plus'})})},'\uD83D\uDC04 +1 pasture')),
    h('div',{class:'spacer'}),
    h('div',{class:'row center'},h('button',{class:'btn alt',style:'font-size:14px;min-height:40px;padding:8px 14px',disabled:last?null:true,onclick:act(function(){var a=hist.pop();if(!a)return;
        if(a.t==='plus')st[k]=Math.max(0,st[k]-1);
        else{st[k]+=a.loss;var i=st.log.lastIndexOf(a.msg);if(i>=0)st.log.splice(i,1)}})},last&&last.t==='cem'?'Undo cemetery':'Undo'),
      h('button',{class:'btn warn',onclick:act(function(){var loss=Math.ceil(st[k]/4);if(!loss)return;if(confirm('Cemetery on '+st[nk]+'? Lose '+loss+' of '+st[k]+' points.')){var msg=st[nk]+' lost '+loss+(loss===1?' point (':' points (')+st[k]+' to '+(st[k]-loss)+')';st.log.push(msg);hist.push({t:'cem',loss:loss,msg:msg});st[k]-=loss}})},'Cemetery!')))}
  return [h('div',{class:'herd'},side('left','lname'),side('right','rname')),
    st.log&&st.log.length?h('div',{class:'card'},h('h3',null,'Cemetery casualties'),st.log.map(function(l){return h('div',{class:'muted'},'☠ '+l)})):null,
    h('button',{class:'btn alt wide',onclick:act(function(){if(confirm('Start a new game?')){st.left=0;st.right=0;st.log=[];st.hist={left:[],right:[]}}})},'New game')]}},

{id:'bingo',group:'spot',ico:'🎯',title:'Texas Road Bingo',blurb:'Your own card of things on Texas roads. Five in a row wins.',
 phones:'Everyone on their own phone. Tap your own name first so you get your own card. Dad is driving, so he sits this one out.',
 rules:['Pick your name to get your own card. Everybody gets a different one.','Tap a square when you spot it. Call it out so it counts.','Five in a row (across, down or diagonal) wins. The middle is free.','Hard mode: blackout. Fill the whole card.'],
 body:function(st){st.who=st.who||'p0';st.seed=st.seed||{};st.marks=st.marks||{};
  var who=st.who,sd=st.seed[who]||0,items=shuffle(BINGO,seeded(nameOf(who)+'|'+sd)).slice(0,24);items.splice(12,0,'FREE');
  var m=st.marks[who]||(st.marks[who]=[]);m[12]=true;
  var lines=[];for(var i=0;i<5;i++){lines.push([0,1,2,3,4].map(function(c){return i*5+c}));lines.push([0,1,2,3,4].map(function(r){return r*5+i}))}
  lines.push([0,6,12,18,24]);lines.push([4,8,12,16,20]);
  var wins=lines.filter(function(l){return l.every(function(x){return m[x]})});var winCells={};wins.forEach(function(l){l.forEach(function(x){winCells[x]=1})});
  var count=m.filter(Boolean).length;
  return [h('div',{class:'card'},h('h3',null,'Whose card?'),h('div',{class:'chips'},players().map(function(p){return h('button',{class:'chip'+(p.id===who?' on':''),onclick:act(function(){st.who=p.id})},p.label)}))),
    count===25?h('div',{class:'banner'},'BLACKOUT! '+nameOf(who)+' is a legend'):wins.length?h('div',{class:'banner'},'BINGO! '+nameOf(who)+' wins'):null,
    h('div',{class:'card'},h('div',{class:'bingo'},items.map(function(it,ix){return h('button',{class:(ix===12?'free':m[ix]?'on':'')+(winCells[ix]?' win':''),onclick:ix===12?null:act(function(){m[ix]=!m[ix]})},it)}))),
    h('button',{class:'btn alt wide',onclick:act(function(){if(confirm('Deal '+nameOf(who)+' a new card?')){st.seed[who]=sd+1;st.marks[who]=[]}})},'New card for '+nameOf(who))]}},

{id:'plates',group:'spot',ico:'🚗',title:'License Plates',blurb:'How many states can you find?',

{id:'alpha',group:'spot',ico:'🔤',title:'Alphabet Game',blurb:'Find A to Z in order on signs.',

    h('div',{class:'card'},h('div',{class:'letters'},L.split('').map(function(c,ix){return h('div',{class:ix<st.i?'done':ix===st.i?'now':''},c)}))),

{id:'contact',group:'all',ico:'🤝',title:'Contact',blurb:'The word game the whole car can play together.',
 phones:'Only the word-holder needs a phone, to type the secret word. Everyone else just talks. If Dad is the word-holder, he keeps his word in his head.',
 rules:['One person (the word-holder) secretly picks a word and says only its first letter.','Everyone else thinks of words starting with the letters so far and gives a clue out loud: "Is it something you wear on your head?"','If another guesser knows what they mean, they shout "Contact!" and the two count down 3-2-1 and say the word together.','The word-holder can block it by guessing the clue word first: "No, it is not HAT."','If the two guessers match, the word-holder has to reveal the next letter.','Guess the secret word and you win the round. The winner is the next word-holder.'],
 body:function(st){st.word=st.word||'';st.n=st.n||1;st.locked=!!st.locked;
  if(!st.locked)return [h('div',{class:'card'},h('h3',null,'Word-holder: type your word (no peeking, everybody else)'),
      h('input',{type:'password',autocomplete:'off',value:st.word,oninput:function(e){e.target.value=e.target.value.replace(/[^a-zA-Z]/g,'');st.word=e.target.value;save()}}),
      h('div',{class:'spacer'}),
      h('button',{class:'btn wide',onclick:act(function(){if(st.word.length>1){st.locked=true;st.n=1;st.solved=false}})},'Lock it in'))];
  var w=st.word.toUpperCase(),shown=st.solved?w:w.slice(0,st.n);
  return [h('div',{class:'card'},
    h('div',{class:'sub'},st.solved?'The word was':'Letters so far'),
    h('div',{class:'big',style:'letter-spacing:.12em'},shown+(st.solved?'':'...')),
    st.solved?null:st.n>=w.length?h('div',{class:'banner'},'All letters out! Guessers win.'):null,
    st.solved?null:h('div',{class:'row center'},
      h('button',{class:'btn sun',disabled:st.n>=w.length?true:null,onclick:act(function(){st.n++})},'Contact! Next letter'),
      h('button',{class:'btn',onclick:act(function(){st.solved=true})},'Someone guessed it'))),
    h('button',{class:'btn alt wide',onclick:act(function(){st.locked=false;st.word='';st.solved=false;st.n=1})},'New word (next word-holder)')]}},

{id:'movie',group:'all',ico:'🎬',title:'Movie Chain',blurb:'Actor, movie, actor, movie... until someone breaks.',

  return [levelPicker(st,function(l){return TURN_SECS[l-1]+' seconds per answer'}),h('div',{class:'card'},timer('movie',TURN_SECS[st.level-1],{beepAt:3})),
    h('div',{class:'card'},h('h3',null,'The chain ('+st.chain.length+' links)'),
      h('div',{class:'row'},h('div',{class:'grow'},inp),h('button',{class:'btn',onclick:add},'Add')),
      h('ol',{class:'chain'},st.chain.map(function(c,i){return h('li',null,(i+1)+'. '+c)})),

  var st=G(id);
  return [h('div',{class:'title'},g.ico+' '+g.title),h('p',{class:'blurb'},g.blurb),
    h('div',{class:'card phones'},h('h3',null,'\uD83D\uDCF1 Phones'),h('div',null,g.phones)),
    rulesCard(g.rules),g.body(st),
    h('div',{class:'spacer'}),shareBtn(g,'Send this game to someone')]}

function settings(){
  header('Players',true);
  return [h('div',{class:'card'},h('h3',null,'Who is in the car'),
      S.players.map(function(p,i){return h('div',{class:'row',style:'margin:6px 0'},
        h('div',{class:'grow'},h('input',{value:p.name,onchange:function(e){p.name=e.target.value.trim()||p.name;save()}})),
        h('select',{style:'width:auto',onchange:function(e){p.team=e.target.value;save()}},
          h('option',{value:'parents',selected:p.team==='parents'?true:null},'Parent'),
          h('option',{value:'kids',selected:p.team==='kids'?true:null},'Kid')))}),
      h('p',{class:'muted'},'Names save as you leave each box. Scores stay with each person even if you rename them.')),
    h('div',{class:'card'},h('h3',null,'About'),
      h('p',{class:'muted'},'Everything saves on this phone only. Each phone keeps its own scores, so pick one phone as the scorekeeper for shared games.'),
      h('button',{class:'btn warn',onclick:function(){if(confirm('Erase every score and card on this phone?')){S.games={};save();location.hash='#/'}}},'Reset all games'))]}

function route(){
  var hs=location.hash.replace(/^#\/?/,'');var parts=hs.split('/');var out;
  if(parts[0]==='g')out=gameView(parts[1]);
  else if(parts[0]==='settings')out=settings();
  else if(parts[0]==='host')out=hostView();
  else out=home();
  app.innerHTML='';app.appendChild(h('div',null,out));
}
function refresh(){var y=window.scrollY;route();window.scrollTo(0,y)}
window.addEventListener('hashchange',function(){route();window.scrollTo(0,0)});
route();

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
